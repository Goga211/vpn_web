<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Nimbus — цифровая подписка с моментальной активацией и пробным периодом."
    />
    <link rel="icon" href="%BASE_URL%assets/logo.svg" type="image/svg+xml" />
    <title>Nimbus — цифровая подписка</title>
  </head>
  <body>
    <div id="root">
      <!-- Видимый запасной экран до старта React. Если бандл вообще не выполнится
           (старый WebView, обрыв сети), пользователь увидит текст, а не серое
           полотно. React заменит это содержимое при первом рендере. -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#8a8780;text-align:center">
        <div>
          <p style="font-size:15px;margin:0">Загрузка…</p>
          <noscript>Для работы страницы включите JavaScript.</noscript>
        </div>
      </div>
    </div>
    <!-- SDK Telegram хостим у себя: внешний https://telegram.org/js/telegram-web-app.js
         блокирует рендер и может быть недоступен в сетях с DPI у части пользователей,
         из-за чего Mini App зависает на сером экране. Локальный файл same-origin
         грузится надёжно и тоже покрыт CSP. -->
    <script src="%BASE_URL%telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
